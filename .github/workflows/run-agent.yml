name: Run AI Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Add program to add two numbers in JavaScript add add in samplerules folder"
        required: true
        type: string
      base_branch:
        description: "Base branch to open the PR against (defaults to main)"
        required: false
        default: "main"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    name: Run agent and open PR
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is useful if the agent needs git context
          fetch-depth: 0

      # ── 2. Node setup ──────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install Claude Code CLI (provides built-in tools: Read/Edit/Glob) ─
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # ── 4. Install project dependencies ───────────────────────────────────
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # ── 5. Run the agent ───────────────────────────────────────────────────
      - name: Run agent.ts
        working-directory: server
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          # Expose the token so agent-made gh/git calls also authenticate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node --loader ts-node/esm src/agent.ts

      # ── 6. Detect whether agent produced any changes ───────────────────────
      - name: Check for file changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No file changes detected — skipping PR creation."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 7. Commit and push on a new branch ────────────────────────────────
      - name: Commit changes to a new branch
        if: steps.changes.outputs.changed == 'true'
        id: branch
        run: |
          BRANCH="agent/$(date +%Y%m%d-%H%M%S)"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(agent): apply AI-generated changes

          Prompt: ${{ inputs.prompt }}

          Triggered-by: @${{ github.actor }}
          Workflow-run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push origin "$BRANCH"

      # ── 8. Open the PR ─────────────────────────────────────────────────────
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "agent: ${{ inputs.prompt }}" \
            --body "$(cat <<'EOF'
          ## AI Agent Changes

          This PR was automatically generated by **agent.ts** via the [Run AI Agent](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

          ---

          ### Prompt
          > ${{ inputs.prompt }}

          ---

          ### Metadata
          | Field | Value |
          |---|---|
          | Triggered by | @${{ github.actor }} |
          | Workflow run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | Base branch | `${{ inputs.base_branch }}` |
          | Agent branch | `${{ steps.branch.outputs.name }}` |

          > [!NOTE]
          > Review all changes before merging — the agent operates autonomously.
          EOF
          )" \
            --head "${{ steps.branch.outputs.name }}" \
            --base "${{ inputs.base_branch }}"
