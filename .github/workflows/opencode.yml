name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode CLI
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Start the Ollama server in the background
          ollama serve > /dev/null 2>&1 &
          # Wait for Ollama server to be ready
          sleep 5

      - name: Pull the desired Ollama model
        run: ollama pull qwen3:8b
        # Make sure this matches the model name in opencode.json

      - name: Run OpenCode with configuration
        # The opencode.json in the repo root will be automatically detected
        run: opencode github run --event "${{ toJson(github.event) }}"