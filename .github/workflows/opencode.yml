name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write

    steps:
       - name: Checkout repository
         uses: actions/checkout@v6
         with:
           fetch-depth: 1
           persist-credentials: false

       - name: Run OpenCode
         uses: anomalyco/opencode/github@latest
         env:
          # The default GITHUB_TOKEN lacks Copilot Chat permissions.
          # You must add a PAT with Copilot scopes to your Repo Secrets.
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
         with:
          # Provider format: github-copilot/<model_name>
          model: github-copilot/gpt-4