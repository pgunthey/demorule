name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
       - name: Check API Keys Length
         env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         run: |
          echo "Claude API Key length: ${#ANTHROPIC_API_KEY}"
          echo "GitHub Token length: ${#GITHUB_TOKEN}"
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "ERROR: ANTHROPIC_API_KEY is empty"; fi
          if [ -z "$GITHUB_TOKEN" ]; then echo "ERROR: GITHUB_TOKEN is empty"; fi

       - name: Checkout repository
         uses: actions/checkout@v6
         with:
           fetch-depth: 1
           persist-credentials: true

       - name: Run OpenCode
         uses: anomalyco/opencode/github@latest
         env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USE_GITHUB_TOKEN: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
         with:
          model: claude-3-sonnet-20240229